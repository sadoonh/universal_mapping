<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Universal Mapping · Interactive Schema Viewer</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('universal-mapping-erd.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (_) {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d17;
      --surface: #101726;
      --surface-raised: #151e30;
      --surface-hover: #1a263b;
      --canvas: #0c1220;
      --canvas-dot: rgba(148, 163, 184, 0.09);
      --border: #27344a;
      --border-strong: #3a4a65;
      --text: #eef4ff;
      --muted: #96a5bc;
      --subtle: #6f809a;
      --accent: #72a8ff;
      --accent-strong: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --pk: #63dbb6;
      --pk-soft: rgba(45, 212, 160, 0.14);
      --fk: #f4bd6a;
      --fk-soft: rgba(244, 189, 106, 0.14);
      --relationship: #c694ff;
      --danger: #ff8b9b;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      --focus: 0 0 0 3px rgba(114, 168, 255, 0.34);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #edf2f8;
      --surface: #ffffff;
      --surface-raised: #f8fafc;
      --surface-hover: #eef3f9;
      --canvas: #f4f7fb;
      --canvas-dot: rgba(51, 65, 85, 0.1);
      --border: #cfdae8;
      --border-strong: #adbed2;
      --text: #152033;
      --muted: #53647b;
      --subtle: #718198;
      --accent: #2369c9;
      --accent-strong: #2369c9;
      --accent-soft: rgba(35, 105, 201, 0.11);
      --pk: #087e62;
      --pk-soft: rgba(8, 126, 98, 0.1);
      --fk: #9a5d08;
      --fk-soft: rgba(154, 93, 8, 0.1);
      --relationship: #7542ac;
      --danger: #ba304c;
      --shadow: 0 18px 42px rgba(42, 58, 82, 0.14);
      --focus: 0 0 0 3px rgba(35, 105, 201, 0.24);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% -10%, rgba(59, 130, 246, 0.13), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      transition: background-color 160ms ease, color 160ms ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible, input:focus-visible, .table-card:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .app-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 16px clamp(14px, 3vw, 40px) 28px;
    }

    .topbar { margin-bottom: 10px; }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.7rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .viewer {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .search-wrap {
      position: relative;
      flex: 1 1 260px;
      min-width: 170px;
      max-width: 380px;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 11px;
      width: 16px;
      height: 16px;
      color: var(--subtle);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 34px 0 35px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--canvas);
      color: var(--text);
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .search-input::placeholder { color: var(--subtle); }
    .search-input:hover { border-color: var(--border-strong); }
    .search-input:focus { border-color: var(--accent); }

    .clear-search {
      position: absolute;
      top: 50%;
      right: 6px;
      display: none;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transform: translateY(-50%);
    }

    .clear-search.visible { display: grid; place-items: center; }
    .clear-search:hover { background: var(--surface-hover); color: var(--text); }

    .tool-group {
      display: flex;
      align-items: center;
      flex: none;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--canvas);
    }

    .tool-button {
      display: inline-flex;
      min-width: 32px;
      height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease, transform 130ms ease;
    }

    .tool-button:hover { background: var(--surface-hover); color: var(--text); }
    .tool-button:active { transform: translateY(1px); }
    .tool-button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .tool-button.danger:hover { background: rgba(255, 79, 110, 0.11); color: var(--danger); }

    .tool-button svg { width: 15px; height: 15px; flex: none; }

    .zoom-readout {
      min-width: 44px;
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .diagram-viewport {
      position: relative;
      height: clamp(450px, 61vh, 680px);
      overflow: auto;
      overscroll-behavior: contain;
      cursor: grab;
      touch-action: none;
      background-color: var(--canvas);
      background-image: radial-gradient(circle, var(--canvas-dot) 1px, transparent 1.3px);
      background-position: 0 0;
      background-size: 22px 22px;
      scrollbar-color: var(--border-strong) transparent;
    }

    .diagram-stage { position: relative; min-width: 100%; min-height: 100%; }

    .diagram-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1260px;
      height: 680px;
      transform-origin: 0 0;
    }

    .diagram-viewport.panning { cursor: grabbing; }

    .connectors {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .relationship-path {
      fill: none;
      stroke: var(--relationship);
      stroke-width: 2;
      stroke-dasharray: 6 5;
      vector-effect: non-scaling-stroke;
      opacity: 0.82;
    }

    .relationship-node {
      fill: var(--canvas);
      stroke: var(--relationship);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .relationship-label-bg { fill: var(--canvas); stroke: var(--border); stroke-width: 1; }
    .relationship-label { fill: var(--relationship); font-size: 11px; font-weight: 800; }

    .table-card {
      position: absolute;
      z-index: 3;
      width: 336px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      outline: none;
      background: var(--surface-raised);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      user-select: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    .table-card:hover {
      border-color: color-mix(in srgb, var(--accent) 65%, var(--border));
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26);
    }

    .table-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), 0 18px 38px rgba(0, 0, 0, 0.3);
    }

    .table-card.dragging {
      z-index: 10;
      border-color: var(--accent);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
      cursor: grabbing;
      transition: none;
    }

    .table-card[hidden] { display: none; }

    .table-header {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--accent-soft), transparent 78%);
      cursor: grab;
      touch-action: none;
    }

    .table-card.dragging .table-header { cursor: grabbing; }

    .table-title-wrap { min-width: 0; }

    .table-title {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drag-grip {
      display: grid;
      flex: none;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      color: var(--subtle);
    }

    .table-header:hover .drag-grip { background: var(--surface-hover); color: var(--text); }
    .drag-grip svg { width: 15px; height: 15px; }

    .field-list { margin: 0; padding: 5px 0; list-style: none; }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      min-height: 37px;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
    }

    .field-row:last-child { border-bottom: 0; }
    .field-row:hover { background: color-mix(in srgb, var(--surface-hover) 62%, transparent); }
    .field-name { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; }
    .field-row.is-pk .field-name { color: var(--pk); font-weight: 800; }
    .field-row.is-fk .field-name { color: var(--fk); font-weight: 800; }
    .field-type { color: var(--subtle); font-size: 0.67rem; }

    .badge {
      padding: 2px 5px;
      border-radius: 5px;
      font-family: Inter, ui-sans-serif, sans-serif;
      font-size: 0.56rem;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .field-badges { display: inline-flex; justify-content: flex-end; gap: 3px; }
    .badge.pk { background: var(--pk-soft); color: var(--pk); }
    .badge.fk { background: var(--fk-soft); color: var(--fk); }
    .badge.nn, .badge.id { background: var(--accent-soft); color: var(--accent); }

    .no-results {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      display: none;
      width: min(330px, calc(100% - 36px));
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color: var(--muted);
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .no-results.visible { display: block; }
    .no-results strong { display: block; margin-bottom: 3px; color: var(--text); }

    .viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      padding: 8px 13px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      color: var(--subtle);
      font-size: 0.72rem;
    }

    .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
    .legend-dot.pk { background: var(--pk); }
    .legend-dot.fk { background: var(--fk); }
    kbd {
      min-width: 19px;
      padding: 1px 5px;
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--canvas);
      color: var(--muted);
      font: 0.67rem ui-monospace, monospace;
      text-align: center;
    }

    .data-panel {
      width: max-content;
      max-width: 100%;
      margin: 16px auto 0;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .data-panel[hidden] { display: none; }

    .data-panel-header {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 48px;
      padding: 8px 48px;
      border-bottom: 1px solid var(--border-strong);
      background: var(--surface-raised);
      text-align: center;
    }

    .data-panel-title { margin: 0; font-size: 0.9rem; letter-spacing: 0.01em; }

    .close-button {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--muted);
      cursor: pointer;
    }

    .close-button:hover { border-color: var(--border-strong); color: var(--text); }
    .data-scroll { width: max-content; max-width: 100%; max-height: 300px; overflow: auto; }

    .data-table { width: max-content; margin: 0 auto; border-collapse: collapse; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .data-table th, .data-table td {
      padding: 8px 10px;
      border-right: 2px solid var(--border-strong);
      border-bottom: 2px solid var(--border-strong);
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .data-table th:last-child, .data-table td:last-child { border-right: 0; }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: color-mix(in srgb, var(--surface-raised) 84%, var(--accent-soft));
      border-bottom: 2px solid #000;
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: none;
    }

    .data-table tbody tr:nth-child(even) td:not(.data-col-pk):not(.data-col-fk) { background: color-mix(in srgb, var(--surface-raised) 55%, transparent); }
    .data-table td { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .data-table .data-col-pk { background: var(--pk-soft); color: var(--pk); font-weight: 700; }
    .data-table .data-col-fk { background: var(--fk-soft); color: var(--fk); font-weight: 700; }
    .data-table tbody tr:hover td:not(.data-col-pk):not(.data-col-fk) { background: var(--surface-hover); color: var(--text); }
    .data-table tbody tr:hover .data-col-pk { background: color-mix(in srgb, var(--pk-soft) 72%, var(--surface-hover)); }
    .data-table tbody tr:hover .data-col-fk { background: color-mix(in srgb, var(--fk-soft) 72%, var(--surface-hover)); }
    .data-table tbody tr:last-child td { border-bottom: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 920px) {
      .toolbar { flex-wrap: wrap; }
      .search-wrap { max-width: none; }
      .toolbar > .tool-group:last-child { margin-left: auto; }
      .tool-button .optional-label { display: none; }
    }

    @media (max-width: 620px) {
      .app-shell { padding-top: 12px; }
      .toolbar { gap: 7px; padding: 9px; }
      .search-wrap { flex-basis: 100%; order: -1; }
      .tool-group { flex: 1; justify-content: center; }
      .diagram-viewport { height: 54vh; min-height: 390px; }
      .viewer-footer { align-items: flex-start; }
      .data-table th, .data-table td { padding: 9px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>Universal Mapping</h1>
    </header>

    <section class="viewer" aria-label="Universal Mapping entity relationship diagram viewer">
      <div class="toolbar" role="toolbar" aria-label="Diagram controls">
        <label class="search-wrap">
          <span class="sr-only">Filter tables or fields</span>
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input class="search-input" id="searchInput" type="search" placeholder="Search" autocomplete="off">
          <button class="clear-search" id="clearSearch" type="button" aria-label="Clear table filter" title="Clear filter">×</button>
        </label>

        <div class="tool-group" aria-label="Zoom controls">
          <button class="tool-button" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out (−)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M8 11h6m6 9-4-4"></path></svg>
          </button>
          <span class="zoom-readout" id="zoomReadout" aria-live="polite">100%</span>
          <button class="tool-button" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in (+)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M11 8v6M8 11h6m6 9-4-4"></path></svg>
          </button>
          <button class="tool-button" id="fitView" type="button" aria-label="Fit diagram to view" title="Fit diagram to view (0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"></path></svg>
          </button>
        </div>

        <div class="tool-group" aria-label="Layout controls">
          <button class="tool-button" id="autoLayout" type="button" aria-label="Restore the default Universal Mapping table arrangement" title="Restore the default table arrangement">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="7" height="6" rx="1"></rect><rect x="14" y="14" width="7" height="6" rx="1"></rect><path d="M10 7h4a3 3 0 0 1 3 3v4"></path></svg>
          </button>
          <button class="tool-button danger" id="resetAll" type="button" aria-label="Reset saved Universal Mapping layout and viewer preferences" title="Reset saved layout and viewer preferences">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4v6h6M5.5 15a8 8 0 1 0 .5-7l-2 2"></path></svg>
          </button>
        </div>

        <div class="tool-group" aria-label="Display controls">
          <button class="tool-button" id="relationshipsToggle" type="button" aria-label="Show or hide declared relationships" aria-pressed="true" title="Show or hide relationships (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="7" r="2"></circle><circle cx="19" cy="17" r="2"></circle><path d="M7 12h3a4 4 0 0 0 4-4 1 1 0 0 1 1-1h2M10 12a4 4 0 0 1 4 4 1 1 0 0 0 1 1h2"></path></svg>
          </button>
          <button class="tool-button" id="themeToggle" type="button" title="Switch color theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
            <span class="sr-only" id="themeLabel">Light</span>
          </button>
        </div>
      </div>

      <div class="diagram-viewport" id="viewport" tabindex="0" aria-label="Scrollable Universal Mapping schema diagram">
        <div class="diagram-stage" id="stage">
          <div class="diagram-scene" id="scene">
            <svg class="connectors" id="connectors" aria-hidden="true"></svg>
          </div>
        </div>
        <div class="no-results" id="noResults" role="status">
          <strong>No matches</strong>
        </div>
      </div>

      <footer class="viewer-footer">
        <div class="legend" aria-label="Diagram legend">
          <span class="legend-item"><span class="legend-dot pk"></span>Primary key</span>
          <span class="legend-item"><span class="legend-dot fk"></span>Foreign key</span>
          <span class="legend-item"><span class="badge nn">NN</span>Not null</span>
        </div>
      </footer>
    </section>

    <section class="data-panel" id="dataPanel" aria-labelledby="dataPanelTitle" hidden>
      <header class="data-panel-header">
        <div>
          <h2 class="data-panel-title" id="dataPanelTitle"></h2>
        </div>
        <button class="close-button" id="closeData" type="button" aria-label="Close sample data" title="Close sample data (Escape)">×</button>
      </header>
      <div class="data-scroll" tabindex="0">
        <table class="data-table" id="dataTable"></table>
      </div>
    </section>
    <div class="sr-only" id="announcer" aria-live="polite"></div>
  </main>

  <script>
    'use strict';

    // SQL DDL is authoritative for structure; workbook values are representative rows.
    const schema = [
      {
        name: 'universal_uid',
        fields: [
          { name: 'universal_uid', type: 'INTEGER', badges: ['pk'] },
          { name: 'datatype', type: 'TEXT', badges: ['nn'] },
          { name: 'context', type: 'TEXT', badges: ['nn'] },
          { name: 'unit', type: 'TEXT' },
          { name: 'domain_uid_list', type: 'TEXT[]' }
        ],
        constraints: [],
        rows: [
          { universal_uid: '1', datatype: 'NUMERIC', context: 'Installed capacity', unit: 'MW', domain_uid_list: '{S_A_1, B_A_1, W_A_1}' },
          { universal_uid: '2', datatype: 'NUMERIC', context: 'Total project cost', unit: 'USD', domain_uid_list: '{S_A_2, B_A_2, W_A_2}' },

      {

          { name: 'valid_from', type: 'DATE', badges: ['nn'] },

        ],
        constraints: [

          { name: 'chk_estimation_template_dates', definition: 'CHECK (valid_to IS NULL OR valid_to >= valid_from)' }
        ],
        rows: [
          { template_id: '101', technology: 'Solar', variable_group: 'Assumption', template_name: '2024-01-A', valid_from: '2024-01-01', valid_to: '2024-08-31' },
          { template_id: '102', technology: 'Solar', variable_group: 'Assumption', template_name: '2024-09-B', valid_from: '2024-09-01', valid_to: 'NULL' },
          { template_id: '103', technology: 'Solar', variable_group: 'Preestimation', template_name: '2024-04-A', valid_from: '2024-04-01', valid_to: 'NULL' },
          { template_id: '104', technology: 'Solar', variable_group: 'Model', template_name: '2024-06-C', valid_from: '2024-06-01', valid_to: 'NULL' },
          { template_id: '201', technology: 'Battery', variable_group: 'Assumption', template_name: '2024-03-A', valid_from: '2024-03-01', valid_to: '2025-01-31' },
          { template_id: '202', technology: 'Battery', variable_group: 'Assumption', template_name: '2025-02-B', valid_from: '2025-02-01', valid_to: 'NULL' }
        ]
      }
    ];

    const relationships = [
      { from: 'universal_uid', fromField: 'universal_uid', to: 'domain_variable', toField: 'universal_uid', label: '1:N' }
    ];

    const SCENE = { width: 1260, height: 680 };
    const DEFAULT_POSITIONS = {
      universal_uid: { x: 40, y: 142 },
      domain_variable: { x: 462, y: 64 },
      estimation_template: { x: 884, y: 82 }
    };
    const STORAGE = {
      positions: 'universal-mapping-erd.positions.v1',
      theme: 'universal-mapping-erd.theme',
      zoom: 'universal-mapping-erd.zoom',
      relationships: 'universal-mapping-erd.relationships'
    };
    const MIN_ZOOM = 0.35;
    const MAX_ZOOM = 1.8;

    const elements = {
      viewport: document.getElementById('viewport'),
      stage: document.getElementById('stage'),
      scene: document.getElementById('scene'),
      connectors: document.getElementById('connectors'),
      search: document.getElementById('searchInput'),
      clearSearch: document.getElementById('clearSearch'),
      noResults: document.getElementById('noResults'),
      zoomReadout: document.getElementById('zoomReadout'),
      dataPanel: document.getElementById('dataPanel'),
      dataPanelTitle: document.getElementById('dataPanelTitle'),
      dataTable: document.getElementById('dataTable'),
      closeData: document.getElementById('closeData'),
      relationshipsToggle: document.getElementById('relationshipsToggle'),
      themeToggle: document.getElementById('themeToggle'),
      themeIcon: document.getElementById('themeIcon'),
      themeLabel: document.getElementById('themeLabel'),
      announcer: document.getElementById('announcer')
    };

    const cards = new Map();
    let positions = loadJSON(STORAGE.positions, DEFAULT_POSITIONS);
    let zoom = clamp(Number(loadValue(STORAGE.zoom, 1)), MIN_ZOOM, MAX_ZOOM);
    let relationshipsVisible = loadValue(STORAGE.relationships, 'true') !== 'false';
    let selectedTable = null;
    let drag = null;
    let pan = null;
    let suppressOpenUntil = 0;
    let connectorFrame = 0;
    let fitOnResize = !hasStoredValue(STORAGE.zoom);

    function hasStoredValue(key) {
      try { return localStorage.getItem(key) !== null; } catch (_) { return false; }
    }

    function loadValue(key, fallback) {
      try { return localStorage.getItem(key) ?? fallback; } catch (_) { return fallback; }
    }

    function loadJSON(key, fallback) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        return parsed && typeof parsed === 'object' ? parsed : structuredClone(fallback);
      } catch (_) {
        return structuredClone(fallback);
      }
    }

    function saveValue(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (_) {}
    }

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

    function iconGrip() {
      return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="6" r="1.5"></circle><circle cx="16" cy="6" r="1.5"></circle><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle><circle cx="8" cy="18" r="1.5"></circle><circle cx="16" cy="18" r="1.5"></circle></svg>';
    }

    function renderCards() {
      schema.forEach((table) => {
        const card = document.createElement('article');
        card.className = 'table-card';
        card.dataset.table = table.name;
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${table.name}, ${table.fields.length} fields, ${table.rows.length} rows`);

        const header = document.createElement('div');
        header.className = 'table-header';
        header.dataset.dragHandle = '';
        header.title = `Drag ${table.name}`;

        const titleWrap = document.createElement('div');
        titleWrap.className = 'table-title-wrap';
        const title = document.createElement('span');
        title.className = 'table-title';
        title.textContent = table.name;
        titleWrap.append(title);

        const grip = document.createElement('span');
        grip.className = 'drag-grip';
        grip.setAttribute('aria-hidden', 'true');
        grip.innerHTML = iconGrip();
        header.append(titleWrap, grip);

        const list = document.createElement('ul');
        list.className = 'field-list';
        table.fields.forEach((field) => {
          const row = document.createElement('li');
          row.className = 'field-row';
          row.dataset.field = field.name;
          const badges = field.badges || [];
          if (badges.includes('pk')) row.classList.add('is-pk');
          if (badges.includes('fk')) row.classList.add('is-fk');

          const fieldName = document.createElement('span');
          fieldName.className = 'field-name';
          fieldName.textContent = field.name;
          row.append(fieldName);

          const badgeWrap = document.createElement('span');
          badgeWrap.className = 'field-badges';
          badges.forEach((badgeName) => {
            const badge = document.createElement('span');
            badge.className = `badge ${badgeName}`;
            badge.textContent = badgeName.toUpperCase();
            const badgeLabel = { pk: 'Primary key', fk: 'Foreign key', nn: 'Not null', id: 'Generated always as identity' }[badgeName];
            badge.title = badgeLabel;
            badge.setAttribute('aria-label', badgeLabel);
            badgeWrap.append(badge);
          });
          row.append(badgeWrap);

          const type = document.createElement('span');
          type.className = 'field-type';
          type.textContent = field.type;
          row.append(type);
          list.append(row);
        });

        card.append(header, list);
        elements.scene.append(card);
        cards.set(table.name, card);

        card.addEventListener('click', () => {
          if (performance.now() >= suppressOpenUntil) showTable(table.name);
        });
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            showTable(table.name);
          }
        });
        header.addEventListener('pointerdown', (event) => startDrag(event, table.name));
      });

      recoverPositions();
      applyPositions();
    }

    function recoverPositions() {
      const recovered = {};
      schema.forEach((table) => {
        const fallback = DEFAULT_POSITIONS[table.name];
        const candidate = positions[table.name] || fallback;
        const card = cards.get(table.name);
        const x = Number.isFinite(Number(candidate.x)) ? Number(candidate.x) : fallback.x;
        const y = Number.isFinite(Number(candidate.y)) ? Number(candidate.y) : fallback.y;
        recovered[table.name] = {
          x: clamp(x, 16, SCENE.width - card.offsetWidth - 16),
          y: clamp(y, 16, SCENE.height - card.offsetHeight - 16)
        };
      });
      positions = recovered;
    }

    function applyPositions() {
      cards.forEach((card, name) => {
        card.style.left = `${positions[name].x}px`;
        card.style.top = `${positions[name].y}px`;
      });
      scheduleConnectors();
    }

    function startDrag(event, name) {
      if (event.button !== 0 || !event.isPrimary) return;
      const card = cards.get(name);
      event.preventDefault();
      card.focus({ preventScroll: true });
      card.classList.add('dragging');
      event.currentTarget.setPointerCapture(event.pointerId);
      drag = {
        pointerId: event.pointerId,
        handle: event.currentTarget,
        card,
        name,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startX: positions[name].x,
        startY: positions[name].y,
        moved: false
      };
      drag.handle.addEventListener('pointermove', moveDrag);
      drag.handle.addEventListener('pointerup', endDrag);
      drag.handle.addEventListener('pointercancel', endDrag);
    }

    function moveDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const dx = (event.clientX - drag.startClientX) / zoom;
      const dy = (event.clientY - drag.startClientY) / zoom;
      if (Math.hypot(dx, dy) > 4) drag.moved = true;
      positions[drag.name] = {
        x: clamp(drag.startX + dx, 16, SCENE.width - drag.card.offsetWidth - 16),
        y: clamp(drag.startY + dy, 16, SCENE.height - drag.card.offsetHeight - 16)
      };
      drag.card.style.left = `${positions[drag.name].x}px`;
      drag.card.style.top = `${positions[drag.name].y}px`;
      fitOnResize = false;
      scheduleConnectors();
    }

    function endDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const completed = drag;
      completed.card.classList.remove('dragging');
      completed.handle.removeEventListener('pointermove', moveDrag);
      completed.handle.removeEventListener('pointerup', endDrag);
      completed.handle.removeEventListener('pointercancel', endDrag);
      if (completed.handle.hasPointerCapture(event.pointerId)) completed.handle.releasePointerCapture(event.pointerId);
      if (completed.moved) {
        suppressOpenUntil = performance.now() + 300;
        saveValue(STORAGE.positions, JSON.stringify(positions));
        announce(`${completed.name} position saved`);
      }
      drag = null;
      scheduleConnectors();
    }

    function showTable(name) {
      const table = schema.find((item) => item.name === name);
      if (!table) return;
      selectedTable = name;
      cards.forEach((card, cardName) => card.classList.toggle('active', cardName === name));
      elements.dataPanelTitle.textContent = table.name;
      elements.dataTable.replaceChildren();

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      table.fields.forEach((field) => {
        const th = document.createElement('th');
        const badges = field.badges || [];
        th.scope = 'col';
        th.textContent = field.name;
        if (badges.includes('pk')) th.classList.add('data-col-pk');
        else if (badges.includes('fk')) th.classList.add('data-col-fk');
        headerRow.append(th);
      });
      thead.append(headerRow);

      const tbody = document.createElement('tbody');
      table.rows.forEach((record) => {
        const row = document.createElement('tr');
        table.fields.forEach((field) => {
          const cell = document.createElement('td');
          const badges = field.badges || [];
          cell.textContent = record[field.name];
          if (badges.includes('pk')) cell.classList.add('data-col-pk');
          else if (badges.includes('fk')) cell.classList.add('data-col-fk');
          row.append(cell);
        });
        tbody.append(row);
      });
      elements.dataTable.append(thead, tbody);
      elements.dataPanel.hidden = false;
      announce(`${name} sample data opened`);
      elements.dataPanel.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
    }

    function closeDataPanel({ restoreFocus = true } = {}) {
      if (elements.dataPanel.hidden) return;
      elements.dataPanel.hidden = true;
      const previous = selectedTable;
      selectedTable = null;
      cards.forEach((card) => card.classList.remove('active'));
      if (restoreFocus && previous && !cards.get(previous).hidden) cards.get(previous).focus({ preventScroll: true });
      announce('Sample data closed');
    }

    function fieldElement(tableName, fieldName) {
      return cards.get(tableName)?.querySelector(`[data-field="${fieldName}"]`);
    }

    function scheduleConnectors() {
      cancelAnimationFrame(connectorFrame);
      connectorFrame = requestAnimationFrame(drawConnectors);
    }

    function drawConnectors() {
      elements.connectors.replaceChildren();
      if (!relationshipsVisible) return;
      const sceneRect = elements.scene.getBoundingClientRect();

      relationships.forEach((relationship) => {
        const fromCard = cards.get(relationship.from);
        const toCard = cards.get(relationship.to);
        if (!fromCard || !toCard || fromCard.hidden || toCard.hidden) return;
        const fromField = fieldElement(relationship.from, relationship.fromField);
        const toField = fieldElement(relationship.to, relationship.toField);
        const fromRect = fromField.getBoundingClientRect();
        const toRect = toField.getBoundingClientRect();
        const fromCardRect = fromCard.getBoundingClientRect();
        const toCardRect = toCard.getBoundingClientRect();
        const fromCenter = fromCardRect.left + fromCardRect.width / 2;
        const toCenter = toCardRect.left + toCardRect.width / 2;
        const sourceLeftOfTarget = fromCenter < toCenter;
        const x1 = ((sourceLeftOfTarget ? fromRect.right : fromRect.left) - sceneRect.left) / zoom;
        const y1 = (fromRect.top + fromRect.height / 2 - sceneRect.top) / zoom;
        const x2 = ((sourceLeftOfTarget ? toRect.left : toRect.right) - sceneRect.left) / zoom;
        const y2 = (toRect.top + toRect.height / 2 - sceneRect.top) / zoom;
        const span = Math.abs(x2 - x1);
        const bend = Math.max(54, span * 0.46);
        const direction = sourceLeftOfTarget ? 1 : -1;
        const pathData = `M ${x1} ${y1} C ${x1 + bend * direction} ${y1}, ${x2 - bend * direction} ${y2}, ${x2} ${y2}`;

        const path = svgElement('path', { d: pathData, class: 'relationship-path' });
        const sourceNode = svgElement('circle', { cx: x1, cy: y1, r: 4, class: 'relationship-node' });
        const targetNode = svgElement('circle', { cx: x2, cy: y2, r: 4, class: 'relationship-node' });
        elements.connectors.append(path, sourceNode, targetNode);

        const labelX = (x1 + x2) / 2;
        const labelY = (y1 + y2) / 2 - 7;
        const labelBg = svgElement('rect', { x: labelX - 18, y: labelY - 11, width: 36, height: 18, rx: 7, class: 'relationship-label-bg' });
        const label = svgElement('text', { x: labelX, y: labelY + 2, 'text-anchor': 'middle', class: 'relationship-label' });
        label.textContent = relationship.label;
        elements.connectors.append(labelBg, label);
      });
    }

    function svgElement(tag, attributes) {
      const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, value));
      return element;
    }

    function updateStageSize() {
      elements.scene.style.transform = `scale(${zoom})`;
      elements.stage.style.width = `${SCENE.width * zoom}px`;
      elements.stage.style.height = `${SCENE.height * zoom}px`;
      elements.zoomReadout.textContent = `${Math.round(zoom * 100)}%`;
      scheduleConnectors();
    }

    function zoomAtPoint(nextZoom, clientX, clientY) {
      const rect = elements.viewport.getBoundingClientRect();
      const pointX = clientX - rect.left;
      const pointY = clientY - rect.top;
      const logicalX = (elements.viewport.scrollLeft + pointX) / zoom;
      const logicalY = (elements.viewport.scrollTop + pointY) / zoom;
      setZoom(nextZoom, { center: false });
      elements.viewport.scrollLeft = logicalX * zoom - pointX;
      elements.viewport.scrollTop = logicalY * zoom - pointY;
    }

    function setZoom(nextZoom, { persist = true, center = true } = {}) {
      const oldZoom = zoom;
      const logicalCenter = {
        x: (elements.viewport.scrollLeft + elements.viewport.clientWidth / 2) / oldZoom,
        y: (elements.viewport.scrollTop + elements.viewport.clientHeight / 2) / oldZoom
      };
      zoom = clamp(Math.round(nextZoom * 100) / 100, MIN_ZOOM, MAX_ZOOM);
      fitOnResize = false;
      updateStageSize();
      if (persist) saveValue(STORAGE.zoom, zoom);
      if (center) {
        requestAnimationFrame(() => {
          elements.viewport.scrollLeft = logicalCenter.x * zoom - elements.viewport.clientWidth / 2;
          elements.viewport.scrollTop = logicalCenter.y * zoom - elements.viewport.clientHeight / 2;
        });
      }
    }

    function fitToView({ persist = true } = {}) {
      const visibleCards = [...cards.values()].filter((card) => !card.hidden);
      if (!visibleCards.length) return;
      const bounds = visibleCards.reduce((result, card) => {
        const position = positions[card.dataset.table];
        return {
          left: Math.min(result.left, position.x),
          top: Math.min(result.top, position.y),
          right: Math.max(result.right, position.x + card.offsetWidth),
          bottom: Math.max(result.bottom, position.y + card.offsetHeight)
        };
      }, { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity });
      const padding = 52;
      const width = bounds.right - bounds.left + padding * 2;
      const height = bounds.bottom - bounds.top + padding * 2;
      zoom = clamp(Math.min(elements.viewport.clientWidth / width, elements.viewport.clientHeight / height, 1.45), MIN_ZOOM, MAX_ZOOM);
      zoom = Math.round(zoom * 100) / 100;
      fitOnResize = true;
      updateStageSize();
      if (persist) saveValue(STORAGE.zoom, zoom);
      requestAnimationFrame(() => {
        const centerX = (bounds.left + bounds.right) / 2;
        const centerY = (bounds.top + bounds.bottom) / 2;
        elements.viewport.scrollLeft = centerX * zoom - elements.viewport.clientWidth / 2;
        elements.viewport.scrollTop = centerY * zoom - elements.viewport.clientHeight / 2;
      });
      announce(`Diagram fitted at ${Math.round(zoom * 100)} percent`);
    }

    function autoLayout({ fit = true } = {}) {
      positions = structuredClone(DEFAULT_POSITIONS);
      recoverPositions();
      applyPositions();
      saveValue(STORAGE.positions, JSON.stringify(positions));
      if (fit) requestAnimationFrame(() => fitToView());
      announce('Default table layout restored');
    }

    function resetAll() {
      Object.values(STORAGE).forEach((key) => {
        try { localStorage.removeItem(key); } catch (_) {}
      });
      document.documentElement.dataset.theme = 'dark';
      relationshipsVisible = true;
      elements.relationshipsToggle.setAttribute('aria-pressed', 'true');
      elements.search.value = '';
      applyFilter();
      updateThemeControl();
      closeDataPanel({ restoreFocus: false });
      autoLayout({ fit: true });
      announce('Layout and viewer preferences reset');
    }

    function applyFilter() {
      const query = elements.search.value.trim().toLocaleLowerCase();
      let visibleCount = 0;
      schema.forEach((table) => {
        const searchable = [
          table.name,
          ...table.fields.flatMap((field) => [field.name, field.type]),
          ...table.constraints.flatMap((constraint) => [constraint.name, constraint.definition])
        ].join(' ').toLocaleLowerCase();
        const matches = !query || searchable.includes(query);
        cards.get(table.name).hidden = !matches;
        if (matches) visibleCount += 1;
      });
      elements.clearSearch.classList.toggle('visible', Boolean(query));
      elements.noResults.classList.toggle('visible', visibleCount === 0);
      scheduleConnectors();
      announce(`${visibleCount} table${visibleCount === 1 ? '' : 's'} visible`);
    }

    function toggleRelationships() {
      relationshipsVisible = !relationshipsVisible;
      elements.relationshipsToggle.setAttribute('aria-pressed', String(relationshipsVisible));
      saveValue(STORAGE.relationships, relationshipsVisible);
      scheduleConnectors();
      announce(`Relationships ${relationshipsVisible ? 'shown' : 'hidden'}`);
    }

    function updateThemeControl() {
      const dark = document.documentElement.dataset.theme !== 'light';
      elements.themeLabel.textContent = dark ? 'Light' : 'Dark';
      elements.themeToggle.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
      elements.themeToggle.title = `Switch to ${dark ? 'light' : 'dark'} theme`;
      elements.themeIcon.innerHTML = dark
        ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>'
        : '<path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"></path>';
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      saveValue(STORAGE.theme, next);
      updateThemeControl();
      scheduleConnectors();
      announce(`${next} theme enabled`);
    }

    function startPan(event) {
      if (event.button !== 0 || !event.isPrimary || event.target.closest('.table-card')) return;
      event.preventDefault();
      elements.viewport.focus({ preventScroll: true });
      elements.viewport.setPointerCapture(event.pointerId);
      elements.viewport.classList.add('panning');
      pan = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        scrollLeft: elements.viewport.scrollLeft,
        scrollTop: elements.viewport.scrollTop
      };
    }

    function movePan(event) {
      if (!pan || event.pointerId !== pan.pointerId) return;
      elements.viewport.scrollLeft = pan.scrollLeft - (event.clientX - pan.startX);
      elements.viewport.scrollTop = pan.scrollTop - (event.clientY - pan.startY);
    }

    function endPan(event) {
      if (!pan || event.pointerId !== pan.pointerId) return;
      if (elements.viewport.hasPointerCapture(event.pointerId)) elements.viewport.releasePointerCapture(event.pointerId);
      elements.viewport.classList.remove('panning');
      pan = null;
    }

    function reducedMotion() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
    function announce(message) { elements.announcer.textContent = message; }

    elements.viewport.addEventListener('wheel', (event) => {
      event.preventDefault();
      zoomAtPoint(zoom + (event.deltaY < 0 ? 0.1 : -0.1), event.clientX, event.clientY);
    }, { passive: false });
    elements.viewport.addEventListener('pointerdown', startPan);
    elements.viewport.addEventListener('pointermove', movePan);
    elements.viewport.addEventListener('pointerup', endPan);
    elements.viewport.addEventListener('pointercancel', endPan);

    document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.1));
    document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.1));
    document.getElementById('fitView').addEventListener('click', () => fitToView());
    document.getElementById('autoLayout').addEventListener('click', () => autoLayout());
    document.getElementById('resetAll').addEventListener('click', resetAll);
    elements.relationshipsToggle.addEventListener('click', toggleRelationships);
    elements.themeToggle.addEventListener('click', toggleTheme);
    elements.closeData.addEventListener('click', () => closeDataPanel());
    elements.search.addEventListener('input', applyFilter);
    elements.clearSearch.addEventListener('click', () => {
      elements.search.value = '';
      applyFilter();
      elements.search.focus();
    });

    document.addEventListener('keydown', (event) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (event.key === 'Escape' && !elements.dataPanel.hidden) {
        event.preventDefault();
        closeDataPanel();
      } else if (event.key === '/' && !typing) {
        event.preventDefault();
        elements.search.focus();
      } else if (!typing && (event.key === '+' || event.key === '=')) {
        event.preventDefault();
        setZoom(zoom + 0.1);
      } else if (!typing && event.key === '-') {
        event.preventDefault();
        setZoom(zoom - 0.1);
      } else if (!typing && event.key === '0') {
        event.preventDefault();
        fitToView();
      } else if (!typing && event.key.toLocaleLowerCase() === 'r') {
        event.preventDefault();
        toggleRelationships();
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        recoverPositions();
        applyPositions();
        if (fitOnResize) fitToView({ persist: false });
      }, 80);
    });

    renderCards();
    updateStageSize();
    elements.relationshipsToggle.setAttribute('aria-pressed', String(relationshipsVisible));
    updateThemeControl();
    applyFilter();
    if (fitOnResize) requestAnimationFrame(() => fitToView({ persist: false }));
  </script>
</body>
</html>
