<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Universal Mapping · Interactive Schema Viewer</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('universal-mapping-erd.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (_) {}
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b11;
      --surface: #10151e;
      --surface-raised: #141b26;
      --surface-hover: #1b2533;
      --canvas: #0b1018;
      --canvas-dot: rgba(164, 180, 202, 0.1);
      --border: #242e3c;
      --border-strong: #354154;
      --text: #f1f5fb;
      --muted: #a0adbd;
      --subtle: #748298;
      --accent: #7ab0ff;
      --accent-strong: #4f91f7;
      --accent-soft: rgba(79, 145, 247, 0.14);
      --pk: #62d6b4;
      --pk-soft: rgba(52, 211, 159, 0.12);
      --fk: #efbd72;
      --fk-soft: rgba(245, 176, 65, 0.12);
      --relationship: #b897ef;
      --danger: #f28b9e;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34), 0 2px 8px rgba(0, 0, 0, 0.2);
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.16);
      --focus: 0 0 0 3px rgba(122, 176, 255, 0.34);
      --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-raised: #f8fafc;
      --surface-hover: #edf2f7;
      --canvas: #f5f7fa;
      --canvas-dot: rgba(54, 68, 88, 0.1);
      --border: #d8e0e9;
      --border-strong: #b9c6d4;
      --text: #182334;
      --muted: #526176;
      --subtle: #718096;
      --accent: #246fc6;
      --accent-strong: #1e66b8;
      --accent-soft: rgba(36, 111, 198, 0.1);
      --pk: #087b61;
      --pk-soft: rgba(8, 123, 97, 0.09);
      --fk: #98600b;
      --fk-soft: rgba(152, 96, 11, 0.09);
      --relationship: #7047a4;
      --danger: #b83b54;
      --shadow: 0 24px 65px rgba(37, 51, 69, 0.13), 0 2px 8px rgba(37, 51, 69, 0.06);
      --card-shadow: 0 15px 34px rgba(50, 65, 84, 0.13), 0 2px 6px rgba(50, 65, 84, 0.07);
      --focus: 0 0 0 3px rgba(36, 111, 198, 0.23);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -20%, color-mix(in srgb, var(--accent) 10%, transparent) 0, transparent 38rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible, input:focus-visible, .table-card:focus-visible,
    .diagram-viewport:focus-visible, .data-scroll:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .app-shell {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 20px clamp(16px, 3vw, 48px) 40px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      margin: -8px 0 12px;
      padding: 8px 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
      border-radius: 0 0 12px 12px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      box-shadow: 0 10px 22px color-mix(in srgb, var(--bg) 60%, transparent);
      backdrop-filter: blur(16px) saturate(1.25);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.3rem);
      font-weight: 680;
      line-height: 1.2;
      letter-spacing: -0.025em;
      text-align: center;
    }

    .viewer {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      position: relative;
      z-index: 20;
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
    }

    .tool-group {
      display: inline-flex;
      align-items: center;
      flex: none;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--canvas);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 4%, transparent);
    }

    .tool-button {
      display: inline-grid;
      width: 34px;
      height: 32px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background-color 130ms ease, color 130ms ease, transform 100ms ease, box-shadow 130ms ease;
    }

    .tool-button:hover { background: var(--surface-hover); color: var(--text); }
    .tool-button:active { transform: scale(0.95); }
    .tool-button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .tool-button.danger:hover { background: color-mix(in srgb, var(--danger) 11%, transparent); color: var(--danger); }

    .tool-button svg {
      width: 16px;
      height: 16px;
      flex: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .diagram-viewport {
      position: relative;
      height: clamp(376px, 50vh, 560px);
      overflow: auto;
      overscroll-behavior: contain;
      cursor: grab;
      touch-action: none;
      background-color: var(--canvas);
      background-image: radial-gradient(circle, var(--canvas-dot) 1px, transparent 1.2px);
      background-position: 0 0;
      background-size: 24px 24px;
      scrollbar-color: var(--border-strong) transparent;
      scrollbar-width: thin;
    }

    .diagram-stage { position: relative; min-width: 100%; min-height: 100%; }

    .diagram-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1260px;
      height: 680px;
      transform-origin: 0 0;
    }

    .diagram-viewport.panning { cursor: grabbing; }

    .connectors {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .relationship-path {
      fill: none;
      stroke: var(--relationship);
      stroke-width: 1.75;
      stroke-dasharray: 5 5;
      vector-effect: non-scaling-stroke;
      opacity: 0.78;
    }

    .relationship-node {
      fill: var(--canvas);
      stroke: var(--relationship);
      stroke-width: 1.75;
      vector-effect: non-scaling-stroke;
    }

    .relationship-label-bg { fill: var(--canvas); stroke: var(--border-strong); stroke-width: 1; }
    .relationship-label {
      fill: var(--relationship);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.03em;
    }

    .table-card {
      position: absolute;
      z-index: 3;
      width: 340px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      outline: none;
      background: var(--surface-raised);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      user-select: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease, opacity 140ms ease;
    }

    .table-card::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 5%, transparent);
      content: "";
      pointer-events: none;
    }

    .table-card:hover {
      border-color: color-mix(in srgb, var(--accent) 54%, var(--border));
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.3), 0 2px 7px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    :root[data-theme="light"] .table-card:hover {
      box-shadow: 0 20px 42px rgba(50, 65, 84, 0.15), 0 2px 7px rgba(50, 65, 84, 0.08);
    }

    .table-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--card-shadow);
    }

    .table-card.dragging {
      z-index: 10;
      border-color: var(--accent);
      box-shadow: 0 26px 54px rgba(0, 0, 0, 0.42);
      cursor: grabbing;
      transform: scale(1.012);
      transition: none;
    }

    .table-card[hidden] { display: none; }

    .table-header {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 11px 10px 15px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 11%, transparent), transparent 68%), var(--surface-raised);
      cursor: grab;
      touch-action: none;
    }

    .table-card.dragging .table-header { cursor: grabbing; }

    .table-title-wrap { min-width: 0; }

    .table-title {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-actions { display: flex; flex: none; align-items: center; gap: 1px; }

    .hide-table, .drag-grip {
      display: grid;
      flex: none;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      color: var(--subtle);
      transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
    }

    .hide-table {
      padding: 0;
      border: 0;
      background: transparent;
      opacity: 0.5;
      cursor: pointer;
    }

    .hide-table:hover, .hide-table:focus-visible {
      background: color-mix(in srgb, var(--danger) 11%, transparent);
      color: var(--danger);
      opacity: 1;
    }
    .table-header:hover .hide-table, .table-header:focus-within .hide-table { opacity: 0.82; }
    .drag-grip { opacity: 0.45; }
    .table-header:hover .drag-grip { color: var(--muted); opacity: 0.85; }
    .hide-table svg, .drag-grip svg { width: 15px; height: 15px; }

    .field-list { margin: 0; padding: 4px 0; list-style: none; }

    .field-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(54px, auto);
      min-height: 38px;
      align-items: center;
      gap: 9px;
      padding: 7px 14px 7px 15px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 66%, transparent);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-variant-ligatures: none;
    }

    .field-row:last-child { border-bottom: 0; }
    .field-row:hover { background: color-mix(in srgb, var(--surface-hover) 70%, transparent); }
    .field-row.is-pk::before, .field-row.is-fk::before {
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 2px;
      border-radius: 0 2px 2px 0;
      content: "";
    }
    .field-row.is-pk::before { background: var(--pk); }
    .field-row.is-fk::before { background: var(--fk); }
    .field-name {
      overflow: hidden;
      color: var(--text);
      font-weight: 520;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field-row.is-pk .field-name { color: var(--pk); font-weight: 700; }
    .field-row.is-fk .field-name { color: var(--fk); font-weight: 700; }
    .field-type {
      color: var(--subtle);
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.035em;
      text-align: right;
    }

    .badge {
      min-width: 20px;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: var(--font-ui);
      font-size: 0.52rem;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: 0.065em;
      text-align: center;
    }

    .field-badges { display: inline-flex; justify-content: flex-end; gap: 3px; }
    .badge.pk { background: var(--pk-soft); color: var(--pk); }
    .badge.fk { background: var(--fk-soft); color: var(--fk); }
    .badge.nn, .badge.id { background: var(--accent-soft); color: var(--accent); }

    .viewer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 46px;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      color: var(--subtle);
      font-size: 0.7rem;
      font-weight: 560;
    }

    .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 11%, transparent);
    }
    .legend-dot.pk { background: var(--pk); color: var(--pk); }
    .legend-dot.fk { background: var(--fk); color: var(--fk); }
    kbd {
      min-width: 19px;
      padding: 1px 5px;
      border: 1px solid var(--border-strong);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--canvas);
      color: var(--muted);
      font: 0.67rem ui-monospace, monospace;
      text-align: center;
    }

    .data-panel {
      width: max-content;
      max-width: 100%;
      margin: 22px auto 0;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    .data-panel[hidden] { display: none; }

    .data-panel-header {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 54px;
      padding: 10px 52px;
      border-bottom: 1px solid var(--border-strong);
      background: color-mix(in srgb, var(--accent-soft) 58%, var(--surface-raised));
      text-align: center;
    }

    .data-panel-title {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 10px;
      display: grid;
      width: 32px;
      height: 32px;
      padding: 0 0 2px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--subtle);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .close-button:hover { border-color: var(--border); background: var(--surface-hover); color: var(--text); }
    .data-scroll {
      width: max-content;
      max-width: 100%;
      max-height: min(44vh, 420px);
      overflow: auto;
      scrollbar-color: var(--border-strong) transparent;
      scrollbar-width: thin;
    }

    .data-table {
      width: max-content;
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }
    .data-table th, .data-table td {
      min-width: 92px;
      padding: 10px 13px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .data-table th:last-child, .data-table td:last-child { border-right: 0; }

    .data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-raised);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: calc(0.68rem + 2px);
      font-weight: 720;
      letter-spacing: 0.025em;
      box-shadow: 0 1px 0 var(--border-strong);
    }

    .data-table tbody tr:nth-child(even) td:not(.data-col-pk):not(.data-col-fk) { background: color-mix(in srgb, var(--surface-raised) 68%, var(--surface)); }
    .data-table td {
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: calc(0.72rem + 2px);
    }
    .data-table .data-col-pk { background: color-mix(in srgb, var(--pk-soft) 86%, var(--surface)); color: var(--pk); font-weight: 700; }
    .data-table .data-col-fk { background: color-mix(in srgb, var(--fk-soft) 86%, var(--surface)); color: var(--fk); font-weight: 700; }
    .data-table th.data-col-pk { background: color-mix(in srgb, var(--pk-soft) 90%, var(--surface-raised)); }
    .data-table th.data-col-fk { background: color-mix(in srgb, var(--fk-soft) 90%, var(--surface-raised)); }
    .data-table tbody tr:hover td:not(.data-col-pk):not(.data-col-fk) { background: var(--surface-hover); color: var(--text); }
    .data-table tbody tr:hover .data-col-pk { background: color-mix(in srgb, var(--pk-soft) 74%, var(--surface-hover)); }
    .data-table tbody tr:hover .data-col-fk { background: color-mix(in srgb, var(--fk-soft) 74%, var(--surface-hover)); }
    .data-table .data-col-hover {
      position: relative;
      z-index: 2;
      background: color-mix(in srgb, var(--accent-soft) 72%, var(--surface-hover)) !important;
      color: var(--text) !important;
      box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent);
    }
    .data-table th.data-col-hover { box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent), inset 0 2px 0 var(--accent); }
    .data-table tbody tr:last-child .data-col-hover { box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent), inset 0 -2px 0 var(--accent); }
    .data-table tbody tr:last-child td { border-bottom: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 920px) {
      .toolbar { flex-wrap: wrap; }
      .toolbar > .tool-group:last-child { margin-left: auto; }
      .tool-button .optional-label { display: none; }
    }

    @media (max-width: 620px) {
      .app-shell { padding: 14px 10px 24px; }
      .topbar { min-height: 38px; margin: -6px 0 10px; padding: 7px 12px; }
      h1 { font-size: 1.06rem; }
      .viewer { border-radius: 14px; }
      .toolbar { min-height: 52px; gap: 6px; padding: 7px 8px; }
      .tool-group { flex: 1; justify-content: center; }
      .diagram-viewport { height: 45vh; min-height: 312px; }
      .viewer-footer { min-height: 44px; padding: 8px 12px; }
      .legend { gap: 11px; }
      .data-panel { margin-top: 14px; border-radius: 12px; }
      .data-table th, .data-table td { min-width: 86px; padding: 9px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>Universal Mapping</h1>
    </header>

    <section class="viewer" aria-label="Universal Mapping entity relationship diagram viewer">
      <div class="toolbar" role="toolbar" aria-label="Diagram controls">
        <div class="tool-group" aria-label="View controls">
          <button class="tool-button" id="fitView" type="button" aria-label="Fit diagram to view" title="Fit diagram to view (0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M8 21H3v-5m13 5h5v-5"></path></svg>
          </button>
          <button class="tool-button danger" id="resetAll" type="button" aria-label="Reset saved Universal Mapping layout and viewer preferences" title="Reset saved layout and viewer preferences">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4v6h6M5.5 15a8 8 0 1 0 .5-7l-2 2"></path></svg>
          </button>
        </div>

        <div class="tool-group" aria-label="Display controls">
          <button class="tool-button" id="relationshipsToggle" type="button" aria-label="Show or hide declared relationships" aria-pressed="true" title="Show or hide relationships (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="7" r="2"></circle><circle cx="19" cy="17" r="2"></circle><path d="M7 12h3a4 4 0 0 0 4-4 1 1 0 0 1 1-1h2M10 12a4 4 0 0 1 4 4 1 1 0 0 0 1 1h2"></path></svg>
          </button>
          <button class="tool-button" id="themeToggle" type="button" title="Switch color theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"></svg>
            <span class="sr-only" id="themeLabel">Light</span>
          </button>
        </div>
      </div>

      <div class="diagram-viewport" id="viewport" tabindex="0" aria-label="Scrollable Universal Mapping schema diagram">
        <div class="diagram-stage" id="stage">
          <div class="diagram-scene" id="scene">
            <svg class="connectors" id="connectors" aria-hidden="true"></svg>
          </div>
        </div>
      </div>

      <footer class="viewer-footer">
        <div class="legend" aria-label="Diagram legend">
          <span class="legend-item"><span class="legend-dot pk"></span>Primary key</span>
          <span class="legend-item"><span class="legend-dot fk"></span>Foreign key</span>
          <span class="legend-item"><span class="badge nn">NN</span>Not null</span>
        </div>
      </footer>
    </section>

    <section class="data-panel" id="dataPanel" aria-labelledby="dataPanelTitle" hidden>
      <header class="data-panel-header">
        <div>
          <h2 class="data-panel-title" id="dataPanelTitle"></h2>
        </div>
        <button class="close-button" id="closeData" type="button" aria-label="Close sample data" title="Close sample data (Escape)">×</button>
      </header>
      <div class="data-scroll" tabindex="0">
        <table class="data-table" id="dataTable"></table>
      </div>
    </section>
    <div class="sr-only" id="announcer" aria-live="polite"></div>
  </main>

  <script>
    'use strict';

    // SQL DDL is authoritative for structure; workbook values are representative rows.
    const schema = [
      {
        name: 'universal_uid',
        fields: [
          { name: 'universal_uid', type: 'INTEGER', badges: ['pk'] },
          { name: 'datatype', type: 'TEXT', badges: ['nn'] },
          { name: 'context', type: 'TEXT', badges: ['nn'] },
          { name: 'unit', type: 'TEXT' },
          { name: 'domain_uid_list', type: 'TEXT[]' }
        ],
        constraints: [],
        rows: [
          { universal_uid: '1', datatype: 'NUMERIC', context: 'Installed capacity', unit: 'MW', domain_uid_list: '{S_A_1, B_A_1, W_A_1}' },
          { universal_uid: '2', datatype: 'NUMERIC', context: 'Total project cost', unit: 'USD', domain_uid_list: '{S_A_2, B_A_2, W_A_2}' },
          { universal_uid: '3', datatype: 'DATE', context: 'Commercial operation date', unit: 'NULL', domain_uid_list: '{S_A_3, B_A_3}' }
        ]
      },
      {
        name: 'domain_variable',
        fields: [
          { name: 'domain_uid', type: 'TEXT', badges: ['pk'] },
          { name: 'universal_uid', type: 'INTEGER', badges: ['fk', 'nn'] },
          { name: 'technology', type: 'TEXT', badges: ['nn'] },
          { name: 'variable_group', type: 'TEXT', badges: ['nn'] },
          { name: 'name', type: 'TEXT', badges: ['nn'] },
          { name: 'value', type: 'TEXT' },
          { name: 'datatype', type: 'TEXT' }
        ],
        constraints: [
          { name: 'uq_domain_variable_mapping', definition: 'UNIQUE (universal_uid, technology, variable_group)' }
        ],
        rows: [
          { domain_uid: 'S_A_1', universal_uid: '1', technology: 'Solar', variable_group: 'Assumption', name: 'Solar Capacity', value: '250', datatype: 'NUMERIC' },
          { domain_uid: 'B_A_1', universal_uid: '1', technology: 'Battery', variable_group: 'Assumption', name: 'Battery Capacity', value: '180', datatype: 'NUMERIC' },
          { domain_uid: 'W_A_1', universal_uid: '1', technology: 'Wind', variable_group: 'Assumption', name: 'Wind Capacity', value: '400', datatype: 'NUMERIC' },
          { domain_uid: 'S_A_2', universal_uid: '2', technology: 'Solar', variable_group: 'Assumption', name: 'Project Capacity', value: '30000', datatype: 'NUMERIC' },
          { domain_uid: 'S_E_1', universal_uid: '7', technology: 'Solar', variable_group: 'Preestimation', name: 'Preliminary Capacity', value: '240', datatype: 'NUMERIC' },
          { domain_uid: 'S_M_1_1', universal_uid: '12', technology: 'Solar', variable_group: 'Model', name: 'Modeled Capacity', value: '248', datatype: 'NUMERIC' }
        ]
      },
      {
        name: 'estimation_template',
        fields: [
          { name: 'template_id', type: 'INTEGER', badges: ['pk', 'id'] },
          { name: 'technology', type: 'TEXT', badges: ['nn'] },
          { name: 'variable_group', type: 'TEXT', badges: ['nn'] },
          { name: 'template_name', type: 'TEXT', badges: ['nn'] },
          { name: 'valid_from', type: 'DATE', badges: ['nn'] },
          { name: 'valid_to', type: 'DATE' }
        ],
        constraints: [
          { name: 'uq_estimation_template', definition: 'UNIQUE (technology, variable_group, template_name)' },
          { name: 'chk_estimation_template_dates', definition: 'CHECK (valid_to IS NULL OR valid_to >= valid_from)' }
        ],
        rows: [
          { template_id: '101', technology: 'Solar', variable_group: 'Assumption', template_name: '2024-01-A', valid_from: '2024-01-01', valid_to: '2024-08-31' },
          { template_id: '102', technology: 'Solar', variable_group: 'Assumption', template_name: '2024-09-B', valid_from: '2024-09-01', valid_to: 'NULL' },
          { template_id: '103', technology: 'Solar', variable_group: 'Preestimation', template_name: '2024-04-A', valid_from: '2024-04-01', valid_to: 'NULL' },
          { template_id: '104', technology: 'Solar', variable_group: 'Model', template_name: '2024-06-C', valid_from: '2024-06-01', valid_to: 'NULL' },
          { template_id: '201', technology: 'Battery', variable_group: 'Assumption', template_name: '2024-03-A', valid_from: '2024-03-01', valid_to: '2025-01-31' },
          { template_id: '202', technology: 'Battery', variable_group: 'Assumption', template_name: '2025-02-B', valid_from: '2025-02-01', valid_to: 'NULL' }
        ]
      }
    ];

    const relationships = [
      { from: 'universal_uid', fromField: 'universal_uid', to: 'domain_variable', toField: 'universal_uid', label: '1:N' }
    ];

    const SCENE = { width: 1260, height: 680 };
    const SCENE_BASE = { width: 1260, height: 680 };
    const CANVAS_MARGIN = 240;
    const CANVAS_GROW = 1200;
    const DEFAULT_POSITIONS = {
      universal_uid: { x: 40, y: 142 },
      domain_variable: { x: 462, y: 64 },
      estimation_template: { x: 884, y: 82 }
    };
    const STORAGE = {
      positions: 'universal-mapping-erd.positions.v1',
      theme: 'universal-mapping-erd.theme',
      zoom: 'universal-mapping-erd.zoom',
      relationships: 'universal-mapping-erd.relationships',
      hiddenTables: 'universal-mapping-erd.hidden-tables'
    };
    const MIN_ZOOM = 0.35;
    const MAX_ZOOM = 1.8;

    const elements = {
      viewport: document.getElementById('viewport'),
      stage: document.getElementById('stage'),
      scene: document.getElementById('scene'),
      connectors: document.getElementById('connectors'),
      dataPanel: document.getElementById('dataPanel'),
      dataPanelTitle: document.getElementById('dataPanelTitle'),
      dataTable: document.getElementById('dataTable'),
      closeData: document.getElementById('closeData'),
      relationshipsToggle: document.getElementById('relationshipsToggle'),
      themeToggle: document.getElementById('themeToggle'),
      themeIcon: document.getElementById('themeIcon'),
      themeLabel: document.getElementById('themeLabel'),
      announcer: document.getElementById('announcer')
    };

    const cards = new Map();
    let positions = loadJSON(STORAGE.positions, DEFAULT_POSITIONS);
    let zoom = clamp(Number(loadValue(STORAGE.zoom, 1)), MIN_ZOOM, MAX_ZOOM);
    let relationshipsVisible = loadValue(STORAGE.relationships, 'true') !== 'false';
    const savedHiddenTables = loadJSON(STORAGE.hiddenTables, []);
    let hiddenTables = new Set(Array.isArray(savedHiddenTables) ? savedHiddenTables : []);
    let selectedTable = null;
    let drag = null;
    let pan = null;
    let suppressOpenUntil = 0;
    let connectorFrame = 0;
    let fitOnResize = !hasStoredValue(STORAGE.zoom);

    function hasStoredValue(key) {
      try { return localStorage.getItem(key) !== null; } catch (_) { return false; }
    }

    function loadValue(key, fallback) {
      try { return localStorage.getItem(key) ?? fallback; } catch (_) { return fallback; }
    }

    function loadJSON(key, fallback) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        return parsed && typeof parsed === 'object' ? parsed : structuredClone(fallback);
      } catch (_) {
        return structuredClone(fallback);
      }
    }

    function saveValue(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (_) {}
    }

    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

    function iconGrip() {
      return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="6" r="1.5"></circle><circle cx="16" cy="6" r="1.5"></circle><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle><circle cx="8" cy="18" r="1.5"></circle><circle cx="16" cy="18" r="1.5"></circle></svg>';
    }

    function iconHide() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 12 4c5.5 0 9 5 9 5a16 16 0 0 1-2.1 2.6M6.6 6.6C4.3 8 3 10 3 10s3.5 5 9 5c1 0 2-.2 2.9-.5"></path></svg>';
    }

    function renderCards() {
      schema.forEach((table) => {
        const card = document.createElement('article');
        card.className = 'table-card';
        card.dataset.table = table.name;
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${table.name}, ${table.fields.length} fields, ${table.rows.length} rows`);

        const header = document.createElement('div');
        header.className = 'table-header';
        header.dataset.dragHandle = '';
        header.title = `Drag ${table.name}`;

        const titleWrap = document.createElement('div');
        titleWrap.className = 'table-title-wrap';
        const title = document.createElement('span');
        title.className = 'table-title';
        title.textContent = table.name;
        titleWrap.append(title);

        const actions = document.createElement('div');
        actions.className = 'table-actions';
        const hideButton = document.createElement('button');
        hideButton.className = 'hide-table';
        hideButton.type = 'button';
        hideButton.title = `Hide ${table.name}`;
        hideButton.setAttribute('aria-label', `Hide ${table.name}`);
        hideButton.innerHTML = iconHide();
        hideButton.addEventListener('pointerdown', (event) => event.stopPropagation());
        hideButton.addEventListener('click', (event) => {
          event.stopPropagation();
          hideTable(table.name);
        });
        const grip = document.createElement('span');
        grip.className = 'drag-grip';
        grip.setAttribute('aria-hidden', 'true');
        grip.innerHTML = iconGrip();
        actions.append(hideButton, grip);
        header.append(titleWrap, actions);

        const list = document.createElement('ul');
        list.className = 'field-list';
        table.fields.forEach((field) => {
          const row = document.createElement('li');
          row.className = 'field-row';
          row.dataset.field = field.name;
          const badges = field.badges || [];
          if (badges.includes('pk')) row.classList.add('is-pk');
          if (badges.includes('fk')) row.classList.add('is-fk');

          const fieldName = document.createElement('span');
          fieldName.className = 'field-name';
          fieldName.textContent = field.name;
          row.append(fieldName);

          const badgeWrap = document.createElement('span');
          badgeWrap.className = 'field-badges';
          badges.forEach((badgeName) => {
            const badge = document.createElement('span');
            badge.className = `badge ${badgeName}`;
            badge.textContent = badgeName.toUpperCase();
            const badgeLabel = { pk: 'Primary key', fk: 'Foreign key', nn: 'Not null', id: 'Generated always as identity' }[badgeName];
            badge.title = badgeLabel;
            badge.setAttribute('aria-label', badgeLabel);
            badgeWrap.append(badge);
          });
          row.append(badgeWrap);

          const type = document.createElement('span');
          type.className = 'field-type';
          type.textContent = field.type;
          row.append(type);
          row.addEventListener('pointerenter', () => highlightDataColumn(table.name, field.name));
          row.addEventListener('pointerleave', clearDataColumnHighlight);
          list.append(row);
        });

        card.append(header, list);
        elements.scene.append(card);
        cards.set(table.name, card);
        card.hidden = hiddenTables.has(table.name);

        card.addEventListener('click', () => {
          if (performance.now() >= suppressOpenUntil) showTable(table.name);
        });
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            showTable(table.name);
          }
        });
        header.addEventListener('pointerdown', (event) => startDrag(event, table.name));
      });

      recoverPositions();
      applyPositions();
    }

    function recoverPositions() {
      const recovered = {};
      schema.forEach((table) => {
        const fallback = DEFAULT_POSITIONS[table.name];
        const candidate = positions[table.name] || fallback;
        recovered[table.name] = {
          x: Number.isFinite(Number(candidate.x)) ? Number(candidate.x) : fallback.x,
          y: Number.isFinite(Number(candidate.y)) ? Number(candidate.y) : fallback.y
        };
      });

      const minX = Math.min(...Object.values(recovered).map((position) => position.x));
      const minY = Math.min(...Object.values(recovered).map((position) => position.y));
      const shiftX = minX < 0 ? CANVAS_MARGIN - minX : 0;
      const shiftY = minY < 0 ? CANVAS_MARGIN - minY : 0;
      Object.values(recovered).forEach((position) => {
        position.x += shiftX;
        position.y += shiftY;
      });
      positions = recovered;
      resizeSceneToContent();
    }

    function resizeSceneToContent() {
      const right = Math.max(...schema.map((table) => positions[table.name].x + (cards.get(table.name)?.offsetWidth || 0)));
      const bottom = Math.max(...schema.map((table) => positions[table.name].y + (cards.get(table.name)?.offsetHeight || 0)));
      SCENE.width = Math.max(SCENE_BASE.width, right + CANVAS_MARGIN);
      SCENE.height = Math.max(SCENE_BASE.height, bottom + CANVAS_MARGIN);
    }

    function growSceneForDrag(name, dx, dy) {
      const card = cards.get(name);
      let shiftX = 0;
      let shiftY = 0;
      if (dx < 0 && positions[name].x < CANVAS_MARGIN) shiftX = CANVAS_GROW;
      if (dy < 0 && positions[name].y < CANVAS_MARGIN) shiftY = CANVAS_GROW;

      if (shiftX || shiftY) {
        Object.entries(positions).forEach(([tableName, position]) => {
          position.x += shiftX;
          position.y += shiftY;
          const tableCard = cards.get(tableName);
          tableCard.style.left = `${position.x}px`;
          tableCard.style.top = `${position.y}px`;
        });
        SCENE.width += shiftX;
        SCENE.height += shiftY;
        updateStageSize();
        elements.viewport.scrollLeft += shiftX * zoom;
        elements.viewport.scrollTop += shiftY * zoom;
      }

      while (positions[name].x + card.offsetWidth + CANVAS_MARGIN > SCENE.width) SCENE.width += CANVAS_GROW;
      while (positions[name].y + card.offsetHeight + CANVAS_MARGIN > SCENE.height) SCENE.height += CANVAS_GROW;
      updateStageSize();
    }

    function applyPositions() {
      cards.forEach((card, name) => {
        card.style.left = `${positions[name].x}px`;
        card.style.top = `${positions[name].y}px`;
      });
      scheduleConnectors();
    }

    function startDrag(event, name) {
      if (event.button !== 0 || !event.isPrimary) return;
      const card = cards.get(name);
      event.preventDefault();
      card.focus({ preventScroll: true });
      card.classList.add('dragging');
      event.currentTarget.setPointerCapture(event.pointerId);
      drag = {
        pointerId: event.pointerId,
        handle: event.currentTarget,
        card,
        name,
        lastClientX: event.clientX,
        lastClientY: event.clientY,
        moved: false
      };
      drag.handle.addEventListener('pointermove', moveDrag);
      drag.handle.addEventListener('pointerup', endDrag);
      drag.handle.addEventListener('pointercancel', endDrag);
    }

    function moveDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const dx = (event.clientX - drag.lastClientX) / zoom;
      const dy = (event.clientY - drag.lastClientY) / zoom;
      drag.lastClientX = event.clientX;
      drag.lastClientY = event.clientY;
      if (Math.hypot(dx, dy) > 1) drag.moved = true;
      positions[drag.name].x += dx;
      positions[drag.name].y += dy;
      growSceneForDrag(drag.name, dx, dy);
      drag.card.style.left = `${positions[drag.name].x}px`;
      drag.card.style.top = `${positions[drag.name].y}px`;
      fitOnResize = false;
      scheduleConnectors();
    }

    function endDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const completed = drag;
      completed.card.classList.remove('dragging');
      completed.handle.removeEventListener('pointermove', moveDrag);
      completed.handle.removeEventListener('pointerup', endDrag);
      completed.handle.removeEventListener('pointercancel', endDrag);
      if (completed.handle.hasPointerCapture(event.pointerId)) completed.handle.releasePointerCapture(event.pointerId);
      if (completed.moved) {
        suppressOpenUntil = performance.now() + 300;
        saveValue(STORAGE.positions, JSON.stringify(positions));
        announce(`${completed.name} position saved`);
      }
      drag = null;
      scheduleConnectors();
    }

    function highlightDataColumn(tableName, fieldName) {
      clearDataColumnHighlight();
      if (selectedTable !== tableName || elements.dataPanel.hidden) return;
      elements.dataTable.querySelectorAll(`[data-column="${CSS.escape(fieldName)}"]`).forEach((cell) => {
        cell.classList.add('data-col-hover');
      });
    }

    function clearDataColumnHighlight() {
      elements.dataTable.querySelectorAll('.data-col-hover').forEach((cell) => cell.classList.remove('data-col-hover'));
    }

    function showTable(name) {
      const table = schema.find((item) => item.name === name);
      if (!table) return;
      selectedTable = name;
      cards.forEach((card, cardName) => card.classList.toggle('active', cardName === name));
      elements.dataPanelTitle.textContent = table.name;
      elements.dataTable.replaceChildren();

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      table.fields.forEach((field) => {
        const th = document.createElement('th');
        const badges = field.badges || [];
        th.scope = 'col';
        th.dataset.column = field.name;
        th.textContent = field.name;
        if (badges.includes('pk')) th.classList.add('data-col-pk');
        else if (badges.includes('fk')) th.classList.add('data-col-fk');
        headerRow.append(th);
      });
      thead.append(headerRow);

      const tbody = document.createElement('tbody');
      table.rows.forEach((record) => {
        const row = document.createElement('tr');
        table.fields.forEach((field) => {
          const cell = document.createElement('td');
          const badges = field.badges || [];
          cell.dataset.column = field.name;
          cell.textContent = record[field.name];
          if (badges.includes('pk')) cell.classList.add('data-col-pk');
          else if (badges.includes('fk')) cell.classList.add('data-col-fk');
          row.append(cell);
        });
        tbody.append(row);
      });
      elements.dataTable.append(thead, tbody);
      elements.dataPanel.hidden = false;
      announce(`${name} sample data opened`);
      elements.dataPanel.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
    }

    function closeDataPanel({ restoreFocus = true } = {}) {
      if (elements.dataPanel.hidden) return;
      clearDataColumnHighlight();
      elements.dataPanel.hidden = true;
      const previous = selectedTable;
      selectedTable = null;
      cards.forEach((card) => card.classList.remove('active'));
      if (restoreFocus && previous && !cards.get(previous).hidden) cards.get(previous).focus({ preventScroll: true });
      announce('Sample data closed');
    }

    function fieldElement(tableName, fieldName) {
      return cards.get(tableName)?.querySelector(`[data-field="${fieldName}"]`);
    }

    function scheduleConnectors() {
      cancelAnimationFrame(connectorFrame);
      connectorFrame = requestAnimationFrame(drawConnectors);
    }

    function drawConnectors() {
      elements.connectors.replaceChildren();
      if (!relationshipsVisible) return;
      const sceneRect = elements.scene.getBoundingClientRect();

      relationships.forEach((relationship) => {
        const fromCard = cards.get(relationship.from);
        const toCard = cards.get(relationship.to);
        if (!fromCard || !toCard || fromCard.hidden || toCard.hidden) return;
        const fromField = fieldElement(relationship.from, relationship.fromField);
        const toField = fieldElement(relationship.to, relationship.toField);
        const fromRect = fromField.getBoundingClientRect();
        const toRect = toField.getBoundingClientRect();
        const fromCardRect = fromCard.getBoundingClientRect();
        const toCardRect = toCard.getBoundingClientRect();
        const fromCenter = fromCardRect.left + fromCardRect.width / 2;
        const toCenter = toCardRect.left + toCardRect.width / 2;
        const sourceLeftOfTarget = fromCenter < toCenter;
        const x1 = ((sourceLeftOfTarget ? fromRect.right : fromRect.left) - sceneRect.left) / zoom;
        const y1 = (fromRect.top + fromRect.height / 2 - sceneRect.top) / zoom;
        const x2 = ((sourceLeftOfTarget ? toRect.left : toRect.right) - sceneRect.left) / zoom;
        const y2 = (toRect.top + toRect.height / 2 - sceneRect.top) / zoom;
        const span = Math.abs(x2 - x1);
        const bend = Math.max(54, span * 0.46);
        const direction = sourceLeftOfTarget ? 1 : -1;
        const pathData = `M ${x1} ${y1} C ${x1 + bend * direction} ${y1}, ${x2 - bend * direction} ${y2}, ${x2} ${y2}`;

        const path = svgElement('path', { d: pathData, class: 'relationship-path' });
        const sourceNode = svgElement('circle', { cx: x1, cy: y1, r: 4, class: 'relationship-node' });
        const targetNode = svgElement('circle', { cx: x2, cy: y2, r: 4, class: 'relationship-node' });
        elements.connectors.append(path, sourceNode, targetNode);

        const labelX = (x1 + x2) / 2;
        const labelY = (y1 + y2) / 2 - 7;
        const labelBg = svgElement('rect', { x: labelX - 18, y: labelY - 11, width: 36, height: 18, rx: 7, class: 'relationship-label-bg' });
        const label = svgElement('text', { x: labelX, y: labelY + 2, 'text-anchor': 'middle', class: 'relationship-label' });
        label.textContent = relationship.label;
        elements.connectors.append(labelBg, label);
      });
    }

    function svgElement(tag, attributes) {
      const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, value));
      return element;
    }

    function updateStageSize() {
      elements.scene.style.width = `${SCENE.width}px`;
      elements.scene.style.height = `${SCENE.height}px`;
      elements.scene.style.transform = `scale(${zoom})`;
      elements.stage.style.width = `${SCENE.width * zoom}px`;
      elements.stage.style.height = `${SCENE.height * zoom}px`;
      scheduleConnectors();
    }

    function zoomAtPoint(nextZoom, clientX, clientY) {
      const rect = elements.viewport.getBoundingClientRect();
      const pointX = clientX - rect.left;
      const pointY = clientY - rect.top;
      const logicalX = (elements.viewport.scrollLeft + pointX) / zoom;
      const logicalY = (elements.viewport.scrollTop + pointY) / zoom;
      setZoom(nextZoom, { center: false });
      elements.viewport.scrollLeft = logicalX * zoom - pointX;
      elements.viewport.scrollTop = logicalY * zoom - pointY;
    }

    function setZoom(nextZoom, { persist = true, center = true } = {}) {
      const oldZoom = zoom;
      const logicalCenter = {
        x: (elements.viewport.scrollLeft + elements.viewport.clientWidth / 2) / oldZoom,
        y: (elements.viewport.scrollTop + elements.viewport.clientHeight / 2) / oldZoom
      };
      zoom = clamp(Math.round(nextZoom * 100) / 100, MIN_ZOOM, MAX_ZOOM);
      fitOnResize = false;
      updateStageSize();
      if (persist) saveValue(STORAGE.zoom, zoom);
      if (center) {
        requestAnimationFrame(() => {
          elements.viewport.scrollLeft = logicalCenter.x * zoom - elements.viewport.clientWidth / 2;
          elements.viewport.scrollTop = logicalCenter.y * zoom - elements.viewport.clientHeight / 2;
        });
      }
    }

    function fitToView({ persist = true } = {}) {
      const visibleCards = [...cards.values()].filter((card) => !card.hidden);
      if (!visibleCards.length) return;
      const bounds = visibleCards.reduce((result, card) => {
        const position = positions[card.dataset.table];
        return {
          left: Math.min(result.left, position.x),
          top: Math.min(result.top, position.y),
          right: Math.max(result.right, position.x + card.offsetWidth),
          bottom: Math.max(result.bottom, position.y + card.offsetHeight)
        };
      }, { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity });
      const padding = 52;
      const width = bounds.right - bounds.left + padding * 2;
      const height = bounds.bottom - bounds.top + padding * 2;
      zoom = clamp(Math.min(elements.viewport.clientWidth / width, elements.viewport.clientHeight / height, 1.45), MIN_ZOOM, MAX_ZOOM);
      zoom = Math.round(zoom * 100) / 100;
      fitOnResize = true;
      updateStageSize();
      if (persist) saveValue(STORAGE.zoom, zoom);
      requestAnimationFrame(() => {
        const centerX = (bounds.left + bounds.right) / 2;
        const centerY = (bounds.top + bounds.bottom) / 2;
        elements.viewport.scrollLeft = centerX * zoom - elements.viewport.clientWidth / 2;
        elements.viewport.scrollTop = centerY * zoom - elements.viewport.clientHeight / 2;
      });
      announce(`Diagram fitted at ${Math.round(zoom * 100)} percent`);
    }

    function autoLayout({ fit = true } = {}) {
      positions = structuredClone(DEFAULT_POSITIONS);
      recoverPositions();
      applyPositions();
      saveValue(STORAGE.positions, JSON.stringify(positions));
      if (fit) requestAnimationFrame(() => fitToView());
      announce('Default table layout restored');
    }

    function resetAll() {
      Object.values(STORAGE).forEach((key) => {
        try { localStorage.removeItem(key); } catch (_) {}
      });
      document.documentElement.dataset.theme = 'dark';
      relationshipsVisible = true;
      hiddenTables.clear();
      cards.forEach((card) => { card.hidden = false; });
      elements.relationshipsToggle.setAttribute('aria-pressed', 'true');
      updateThemeControl();
      closeDataPanel({ restoreFocus: false });
      autoLayout({ fit: true });
      announce('Layout and viewer preferences reset');
    }

    function hideTable(name) {
      const card = cards.get(name);
      if (!card) return;
      hiddenTables.add(name);
      saveValue(STORAGE.hiddenTables, JSON.stringify([...hiddenTables]));
      card.hidden = true;
      if (selectedTable === name) closeDataPanel({ restoreFocus: false });
      scheduleConnectors();
      announce(`${name} hidden`);
    }

    function toggleRelationships() {
      relationshipsVisible = !relationshipsVisible;
      elements.relationshipsToggle.setAttribute('aria-pressed', String(relationshipsVisible));
      saveValue(STORAGE.relationships, relationshipsVisible);
      scheduleConnectors();
      announce(`Relationships ${relationshipsVisible ? 'shown' : 'hidden'}`);
    }

    function updateThemeControl() {
      const dark = document.documentElement.dataset.theme !== 'light';
      elements.themeLabel.textContent = dark ? 'Light' : 'Dark';
      elements.themeToggle.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
      elements.themeToggle.title = `Switch to ${dark ? 'light' : 'dark'} theme`;
      elements.themeIcon.innerHTML = dark
        ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>'
        : '<path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"></path>';
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      saveValue(STORAGE.theme, next);
      updateThemeControl();
      scheduleConnectors();
      announce(`${next} theme enabled`);
    }

    function startPan(event) {
      if (event.button !== 0 || !event.isPrimary || event.target.closest('.table-card')) return;
      event.preventDefault();
      elements.viewport.focus({ preventScroll: true });
      elements.viewport.setPointerCapture(event.pointerId);
      elements.viewport.classList.add('panning');
      pan = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        scrollLeft: elements.viewport.scrollLeft,
        scrollTop: elements.viewport.scrollTop
      };
    }

    function movePan(event) {
      if (!pan || event.pointerId !== pan.pointerId) return;
      elements.viewport.scrollLeft = pan.scrollLeft - (event.clientX - pan.startX);
      elements.viewport.scrollTop = pan.scrollTop - (event.clientY - pan.startY);
    }

    function endPan(event) {
      if (!pan || event.pointerId !== pan.pointerId) return;
      if (elements.viewport.hasPointerCapture(event.pointerId)) elements.viewport.releasePointerCapture(event.pointerId);
      elements.viewport.classList.remove('panning');
      pan = null;
    }

    function reducedMotion() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }
    function announce(message) { elements.announcer.textContent = message; }

    elements.viewport.addEventListener('wheel', (event) => {
      event.preventDefault();
      zoomAtPoint(zoom + (event.deltaY < 0 ? 0.1 : -0.1), event.clientX, event.clientY);
    }, { passive: false });
    elements.viewport.addEventListener('pointerdown', startPan);
    elements.viewport.addEventListener('pointermove', movePan);
    elements.viewport.addEventListener('pointerup', endPan);
    elements.viewport.addEventListener('pointercancel', endPan);

    document.getElementById('fitView').addEventListener('click', () => fitToView());
    document.getElementById('resetAll').addEventListener('click', resetAll);
    elements.relationshipsToggle.addEventListener('click', toggleRelationships);
    elements.themeToggle.addEventListener('click', toggleTheme);
    elements.closeData.addEventListener('click', () => closeDataPanel());

    document.addEventListener('keydown', (event) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (event.key === 'Escape' && !elements.dataPanel.hidden) {
        event.preventDefault();
        closeDataPanel();
      } else if (!typing && (event.key === '+' || event.key === '=')) {
        event.preventDefault();
        setZoom(zoom + 0.1);
      } else if (!typing && event.key === '-') {
        event.preventDefault();
        setZoom(zoom - 0.1);
      } else if (!typing && event.key === '0') {
        event.preventDefault();
        fitToView();
      } else if (!typing && event.key.toLocaleLowerCase() === 'r') {
        event.preventDefault();
        toggleRelationships();
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        recoverPositions();
        applyPositions();
        if (fitOnResize) fitToView({ persist: false });
      }, 80);
    });

    renderCards();
    updateStageSize();
    elements.relationshipsToggle.setAttribute('aria-pressed', String(relationshipsVisible));
    updateThemeControl();
    scheduleConnectors();
    if (fitOnResize) requestAnimationFrame(() => fitToView({ persist: false }));
  </script>
</body>
</html>
